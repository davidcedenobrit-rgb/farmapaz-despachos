<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmapaz · Sistema de Despachos</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#080a10;color:#d8dff0;font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 30% 50%,#0d1f3a 0%,#080a10 65%);}
.wrap{width:100%;max-width:380px;padding:24px;}
.logo{text-align:center;margin-bottom:36px;}
.logo-pill{display:inline-block;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);border-radius:20px;padding:4px 14px;font-size:10px;font-weight:700;letter-spacing:3px;color:#fb923c;text-transform:uppercase;margin-bottom:14px;}
.logo-title{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;color:#d8dff0;}
.logo-sub{font-size:12px;color:#7880a0;margin-top:6px;}
.box{background:#0f1119;border:1px solid #252d40;border-radius:16px;padding:32px;box-shadow:0 0 80px rgba(0,0,0,.7);}
.lbl{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7880a0;display:block;margin-bottom:8px;}
.inp{width:100%;background:#141720;border:1px solid #252d40;border-radius:10px;padding:13px 15px;color:#d8dff0;font-family:'Inter',sans-serif;font-size:14px;outline:none;margin-bottom:16px;transition:border-color .2s;}
.inp:focus{border-color:#f97316;}
.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:14px;display:none;}
.btn{width:100%;background:linear-gradient(135deg,#c45a0a,#e07020);border:none;border-radius:10px;padding:14px;color:#fff;font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:opacity .2s;}
.btn:hover{opacity:.88;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.loading{text-align:center;padding:20px;color:#4a5270;font-size:13px;display:none;}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #1e2436;border-top-color:#f97316;border-radius:50%;animation:rot .7s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes rot{to{transform:rotate(360deg)}}
.footer{text-align:center;margin-top:20px;font-size:11px;color:#4a5270;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-pill">Navi Group</div>
    <div class="logo-title">Farmapaz</div>
    <div class="logo-sub">Sistema de Monitoreo de Despachos</div>
  </div>
  <div class="box">
    <div id="err" class="err"></div>
    <label class="lbl">Correo electrónico</label>
    <input class="inp" type="email" id="email" placeholder="usuario@farmapaz.com" autocomplete="email">
    <label class="lbl">Contraseña</label>
    <input class="inp" type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
    <button class="btn" id="btn" onclick="doLogin()">ENTRAR AL SISTEMA</button>
    <div class="loading" id="loading"><span class="spin"></span>Verificando acceso...</div>
  </div>
  <div class="footer">Farmapaz · Navi Dev · Sistema interno</div>
</div>

<script>
const sb=supabase.createClient(
  'https://juxvrbzrxnwrsbeespuc.supabase.co',
  'sb_publishable_O1sx_jWfwOGirGnxZf2Yqw_3BKBV3ti'
);

document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('pass').value;
  const errEl=document.getElementById('err');
  const btn=document.getElementById('btn');
  const loading=document.getElementById('loading');
  errEl.style.display='none';
  btn.style.display='none';
  loading.style.display='block';

  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){
    errEl.textContent='Credenciales incorrectas. Intenta de nuevo.';
    errEl.style.display='block';
    btn.style.display='block';
    loading.style.display='none';
    return;
  }

  // Obtener perfil y redirigir según rol
  const {data:prf}=await sb.from('profiles').select('rol').eq('id',data.user.id).single();
  if(!prf){
    errEl.textContent='Sin perfil asignado. Contacta al administrador.';
    errEl.style.display='block';
    btn.style.display='block';
    loading.style.display='none';
    await sb.auth.signOut();
    return;
  }

  const rutas={monitor:'/monitor',call_center:'/callcenter',piloto:'/piloto'};
  window.location.href=rutas[prf.rol]||'/monitor';
}

// Si ya hay sesión activa, redirigir directo
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const {data:prf}=await sb.from('profiles').select('rol').eq('id',session.user.id).single();
  if(prf){
    const rutas={monitor:'/monitor',call_center:'/callcenter',piloto:'/piloto'};
    window.location.href=rutas[prf.rol]||'/monitor';
  }
})();
</script>
</body>
</html>
