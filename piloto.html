<script>
  // Limpiar TODOS los SW para garantizar un estado limpio
  // La promesa se guarda para que OneSignal la espere antes de init()
  window._swCleanup = ('serviceWorker' in navigator)
    ? navigator.serviceWorker.getRegistrations()
        .then(regs => {
          console.log('[SW] Encontrados:', regs.length, 'service workers');
          return Promise.all(regs.map(r => {
            console.log('[SW] Eliminando:', r.active?.scriptURL || 'pendiente');
            return r.unregister();
          }));
        })
        .then(() => console.log('[SW] Limpieza completa ✅'))
        .catch(e => console.warn('[SW] Error en limpieza:', e.message))
    : Promise.resolve();
</script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(async function(OneSignal) {
    try {
      // Esperar que se limpien todos los SW antes de registrar el nuevo
      await window._swCleanup;
      await Promise.race([
        OneSignal.init({
          appId: "9cdcd38a-95fa-48f4-ada4-fabfa062cf7f",
          notifyButton: { enable: false },
          promptOptions: { slidedown: { enabled: false } },
          serviceWorkerPath: '/OneSignalSDKWorker.js',
          serviceWorkerParam: { scope: '/' }
        }),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout 10s')), 10000))
      ]);
      console.log('[OneSignal] Init completo ✅');
    } catch(err) {
      console.error('[OneSignal] Init falló:', err.message);
      window._oneSignalInitError = err.message;
    }
    window._oneSignalReady = true;
    if (window._pendingPushUserId) {
      iniciarPushNotifications();
    }
  });
</script>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

.lbox{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:28px;width:100%;max-width:360px;}

.linp{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:14px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;outline:none;margin-bottom:16px;transition:border-color .2s;}

<script>

// ── SEGURIDAD: Sanitización XSS ──────────────────────
function sanitizar(str) {
  if (typeof str !== 'string') return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;')
    .replace(/\//g, '&#x2F;');
}
const sb=supabase.createClient(
  'https://juxvrbzrxnwrsbeespuc.supabase.co',
  'sb_publishable_O1sx_jWfwOGirGnxZf2Yqw_3BKBV3ti'
);

let usuario=null, perfil=null, piloto=null;
let pedidos=[], miLat=null, miLng=null;
let gpsWatchId=null, gpsUpdateTimer=null;

// OneSignal Push Notifications
async function iniciarPushNotifications() {
  try {
    if (!('Notification' in window)) return;
    const btn = document.getElementById('notif-btn');

    // Esperar a que OneSignal.init() haya completado
    if (!window._oneSignalReady) {
      // Se llamará de nuevo desde el deferred cuando esté listo
      window._pendingPushUserId = usuario?.id;
      console.log('[OneSignal] No listo aún, esperando init...');
      return;
    }
    window._pendingPushUserId = null;

    const permiso = Notification.permission;
    console.log('[OneSignal] Permiso navegador:', permiso);

    if (permiso === 'denied') {
      setBtnNotif(btn, 'bloqueado');
      return;
    }

    if (permiso !== 'granted') {
      const granted = await OneSignal.Notifications.requestPermission();
      if (!granted) { setBtnNotif(btn, 'bloqueado'); return; }
      toast('🔔 Notificaciones activadas', 'ok');
    }

    await registrarPlayerIdOneSignal();
    setBtnNotif(btn, 'activo');

    // Escuchar notificaciones en foreground
    OneSignal.Notifications.addEventListener('foregroundWillDisplay', (e) => {
      e.preventDefault();
      sonarAlarma();
      vibrarTelefono();
      toast('🔔 ' + (e.notification?.title || 'Nuevo pedido'), 'info');
      setTimeout(cargarPedidos, 1000);
    });
  } catch(err) {
    console.error('[OneSignal] Push init error:', err);
  }
}

function setBtnNotif(btn, estado) {
  if (!btn) return;
  if (estado === 'activo') {
    btn.textContent = '🔔 Activo';
    btn.style.background = 'rgba(34,197,94,.1)';
    btn.style.borderColor = 'rgba(34,197,94,.3)';
    btn.style.color = '#4ade80';
  } else {
    btn.textContent = '🔕 Bloqueado';
    btn.style.background = 'rgba(239,68,68,.1)';
    btn.style.borderColor = 'rgba(239,68,68,.3)';
    btn.style.color = '#f87171';
  }
}

async function activarNotificaciones() {
  const btn = document.getElementById('notif-btn');
  try {
    // Si OneSignal aún no terminó de cargar, reintentar en 2 segundos
    if (!window._oneSignalReady) {
      toast('Cargando sistema de notificaciones, reintentando...', 'info');
      setTimeout(activarNotificaciones, 2000);
      return;
    }
    if (window._oneSignalInitError) {
      toast('Error OneSignal: ' + window._oneSignalInitError, 'err');
      return;
    }

    const permiso = Notification.permission;

    if (permiso === 'denied') {
      setBtnNotif(btn, 'bloqueado');
      toast('Notificaciones bloqueadas — ve a Ajustes del sistema y actívalas para esta app', 'err');
      return;
    }

    // Si el permiso NO está dado aún, pedirlo
    if (permiso !== 'granted') {
      const granted = await OneSignal.Notifications.requestPermission();
      if (!granted) {
        setBtnNotif(btn, 'bloqueado');
        toast('Debes permitir las notificaciones para recibir pedidos', 'err');
        return;
      }
    }

    // Permiso dado — registrar suscripción y vincular usuario
    toast('Activando notificaciones...', 'info');
    await registrarPlayerIdOneSignal();
    setBtnNotif(btn, 'activo');
    toast('🔔 Notificaciones activadas correctamente', 'ok');
  } catch(err) {
    console.error('[OneSignal] Error activando:', err);
    toast('Error al activar: ' + err.message, 'err');
  }
}

async function registrarPlayerIdOneSignal() {
  try {
    if (!usuario) return;

    // Asegurar que la suscripción push esté activa
    const optedIn = OneSignal.User.PushSubscription.optedIn;
    console.log('[OneSignal] optedIn antes de login:', optedIn);
    if (!optedIn) {
      console.log('[OneSignal] Activando suscripción push...');
      try {
        await OneSignal.User.PushSubscription.optIn();
        await new Promise(r => setTimeout(r, 2000));
      } catch(optErr) {
        console.error('[OneSignal] optIn() falló:', optErr);
        toast('Error al crear suscripción push: ' + optErr.message, 'err');
        throw optErr;
      }
    }

    // Vincular UUID de Supabase como external_id
    await OneSignal.login(usuario.id);
    console.log('[OneSignal] login() con external_id:', usuario.id);

    const playerId = OneSignal.User.PushSubscription.id;
    const optedInFinal = OneSignal.User.PushSubscription.optedIn;
    console.log('[OneSignal] optedIn final:', optedInFinal, '| subscriptionId:', playerId);

    if (!playerId) {
      console.warn('[OneSignal] No se obtuvo subscriptionId. El external_id fue registrado igualmente.');
      // No abortamos — el external_id puede funcionar sin guardar el subscription ID
    } else {
      const { error } = await sb.from('pilotos')
        .update({ fcm_token: playerId })
        .eq('profile_id', usuario.id);
      if (error) console.error('[OneSignal] Error guardando subscriptionId:', error);
      else console.log('[OneSignal] Subscription ID guardado en DB ✅', playerId);
    }
  } catch(err) {
    console.error('[OneSignal] Error registrando:', err);
  }
}
let tiempoTimers={};

// Alerta sonora via Web Audio API (sin dependencias externas)
function sonarAlarma() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beep = (freq, start, dur) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.4, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur);
    };
    beep(880, 0, 0.15);
    beep(1100, 0.2, 0.15);
    beep(880, 0.4, 0.15);
    beep(1100, 0.6, 0.3);
  } catch(e) {}
}

function vibrarTelefono() {
  if ('vibrate' in navigator) {
    navigator.vibrate([300, 100, 300, 100, 500]);
  }
}

function alertaNuevoPedido(numeroPedido, cliente) {
  // Sonido + vibración
  sonarAlarma();
  vibrarTelefono();
  // Notificación nativa del navegador si tiene permiso
  if (Notification.permission === 'granted') {
    new Notification('🏍️ Nuevo pedido asignado', {
      body: `#${numeroPedido} · ${cliente}`,
      icon: '/icon-192.png',
      vibrate: [300, 100, 300],
      tag: 'nuevo-pedido',
      renotify: true
    });
  }
  toast(`🔔 Nuevo pedido: #${numeroPedido} · ${cliente}`, 'info');
}



// ── AUTH ──────────────────────────────────────────
async function doLogin(){
  const email=document.getElementById('lemail').value.trim();
  const pass=document.getElementById('lpass').value;
  const errEl=document.getElementById('lerr');
  errEl.style.display='none';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){errEl.textContent='Credenciales incorrectas.';errEl.style.display='block';return;}
  await iniciarApp(data.user);
}
document.getElementById('lpass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function iniciarApp(user){
  usuario=user;
  const {data:prf}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(!prf){
    const e=document.getElementById('lerr');
    e.textContent='Sin perfil. Contacta al administrador.';
    e.style.display='block';
    await sb.auth.signOut();return;
  }
  if(prf.rol!=='piloto'){
    const e=document.getElementById('lerr');
    e.textContent='Este portal es solo para pilotos.';
    e.style.display='block';
    await sb.auth.signOut();return;
  }
  perfil=prf;
  document.getElementById('tb-name').textContent=prf.nombre;

  // Obtener registro del piloto
  const {data:pil}=await sb.from('pilotos').select('*').eq('profile_id',user.id).single();
  piloto=pil;

  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';

  await cargarPedidos();
  suscribirRealtime();
  // Activar GPS automáticamente al entrar
  setTimeout(activarGPS, 1000);
  // Registrar para push — si OneSignal ya está listo lo hacemos ahora,
  // si no, el deferred lo ejecutará cuando init() termine
  window._pendingPushUserId = user.id;
  setTimeout(iniciarPushNotifications, 800);
  // Mostrar banner de instalación PWA si aplica
  setTimeout(checkInstallBanner, 1500);
  // Mantener pantalla encendida
  setTimeout(activarWakeLock, 3000);
}

async function doLogout(){
  detenerGPS();
  await sb.auth.signOut();
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  pedidos=[];piloto=null;
}

// ── GPS ───────────────────────────────────────────
function activarGPS(){
  if(!navigator.geolocation){
    setGPSStatus('error','GPS no disponible');return;
  }
  setGPSStatus('buscando','Buscando señal...');

  // iOS Safari requiere getCurrentPosition primero antes de watchPosition
  navigator.geolocation.getCurrentPosition(
    pos=>{
      miLat=pos.coords.latitude;
      miLng=pos.coords.longitude;
      setGPSStatus('active','GPS activo');
      document.getElementById('gps-coords-footer').textContent=
        `📍 ${miLat.toFixed(5)}, ${miLng.toFixed(5)}`;
      guardarUbicacion();

      // Ahora iniciar el watch continuo
      if(gpsWatchId)navigator.geolocation.clearWatch(gpsWatchId);
      gpsWatchId=navigator.geolocation.watchPosition(
        pos=>{
          miLat=pos.coords.latitude;
          miLng=pos.coords.longitude;
          setGPSStatus('active','GPS activo');
          document.getElementById('gps-coords-footer').textContent=
            `📍 ${miLat.toFixed(5)}, ${miLng.toFixed(5)}`;
        },
        err=>{
          const msgs={1:'Permiso denegado',2:'Sin señal GPS',3:'Tiempo agotado'};
          setGPSStatus('error',msgs[err.code]||'Error GPS');
        },
        {enableHighAccuracy:true,maximumAge:5000,timeout:20000}
      );
    },
    err=>{
      const msgs={1:'Permiso denegado — ve a Ajustes > Safari > Ubicación',2:'Sin señal GPS',3:'Tiempo agotado, intenta de nuevo'};
      setGPSStatus('error',msgs[err.code]||'Error GPS');
      toast(msgs[err.code]||'Error GPS','err');
    },
    {enableHighAccuracy:true,maximumAge:0,timeout:20000}
  );

  // Guardar en Supabase cada 30 segundos
  if(gpsUpdateTimer)clearInterval(gpsUpdateTimer);
  gpsUpdateTimer=setInterval(()=>{
    if(miLat&&miLng)guardarUbicacion();
  },30000);
}

function detenerGPS(){
  if(gpsWatchId)navigator.geolocation.clearWatch(gpsWatchId);
  clearInterval(gpsUpdateTimer);
  gpsWatchId=null;gpsUpdateTimer=null;
}

async function guardarUbicacion(){
  if(!miLat||!miLng||!usuario)return;
  // Actualizar por profile_id del usuario actual
  await sb.from('pilotos').update({
    lat:miLat,lng:miLng,ubicacion_at:new Date().toISOString()
  }).eq('profile_id',usuario.id);
}

function setGPSStatus(estado,txt){
  const dot=document.getElementById('gps-dot');
  const label=document.getElementById('gps-txt');
  dot.className='gps-dot';
  label.className='gps-txt';
  if(estado==='active'){dot.classList.add('active');label.classList.add('active');}
  else if(estado==='error'){dot.classList.add('error');label.classList.add('error');}
  label.textContent=txt;
}

// ── PEDIDOS ───────────────────────────────────────
async function cargarPedidos(){
  if(!piloto){renderPedidos([]);return;}
  const hoy=new Date().toISOString().split('T')[0];
  const {data,error}=await sb.from('pedidos')
    .select('*')
    .eq('piloto_id',piloto.id)
    .in('estado',['asignado','en_ruta','entregado'])
    .gte('created_at',hoy+'T00:00:00')
    .order('created_at',{ascending:false});
  if(error){toast('Error al cargar pedidos','err');return;}
  pedidos=data||[];
  renderPedidos(pedidos);
}

function renderPedidos(lista){
  const wrap=document.getElementById('pedidos-wrap');
  if(!lista.length){
    wrap.innerHTML=`
      <div class="empty-state">
        <span class="empty-ico">📭</span>
        <div class="empty-txt">No tienes despachos asignados<br>por ahora.<br><br>El Monitor te asignará pedidos<br>cuando estén listos.</div>
      </div>`;
    return;
  }

  // Separar activos de entregados
  const activos=lista.filter(p=>p.estado!=='entregado');
  const entregados=lista.filter(p=>p.estado==='entregado');

  let html='';
  if(activos.length){
    html+=activos.map(p=>cardHTML(p)).join('');
  }
  if(entregados.length){
    html+=`<div style="font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:8px 0 10px;">Entregados hoy</div>`;
    html+=entregados.map(p=>cardHTML(p)).join('');
  }
  wrap.innerHTML=html;
}

function cardHTML(p){
  const eLabel={asignado:'ASIGNADO',en_ruta:'EN RUTA',entregado:'ENTREGADO'}[p.estado]||p.estado;
  const eBadge={asignado:'b-asignado',en_ruta:'b-en_ruta',entregado:'b-entregado'}[p.estado]||'';

  // Tiempo en ruta
  let tiempoHTML='';
  if(p.estado==='en_ruta'&&p.salida_at){
    const mins=Math.floor((Date.now()-new Date(p.salida_at).getTime())/60000);
    tiempoHTML=`<div class="pc-tiempo">
      <div class="tiempo-badge" id="timer-${p.id}">${formatMins(mins)}</div>
      <div class="tiempo-label">en ruta</div>
    </div>`;
  }

  // Descripción
  const descHTML=p.descripcion
    ?`<div class="pc-desc">📦 ${p.descripcion}</div>`:'';

  // Teléfono (sin mapa — el piloto usa la dirección escrita por el monitor)
  const telHTML=p.cliente_telefono?`
    <div class="pc-tel">
      <a class="tel-btn" href="tel:${p.cliente_telefono}" style="flex:1;">📞 Llamar al cliente</a>
    </div>`:'';

  // Botones de acción
  let accionHTML='';
  if(p.estado==='asignado'){
    accionHTML=`
      <div class="action-area">
        <div class="gps-info" id="gps-info-${p.id}">
          <span>📍</span>
          <span id="gps-info-txt-${p.id}">Activa el GPS antes de salir</span>
        </div>
        <button class="action-btn btn-salir" onclick="marcarEnRuta('${p.id}')">
          🚀 Confirmar Salida
        </button>
      </div>`;
  } else if(p.estado==='en_ruta'){
    accionHTML=`
      <div class="action-area">
        <div class="gps-info">
          <span>📍</span>
          <span id="gps-info-txt-${p.id}">${miLat?`Ubicación activa · ${miLat.toFixed(4)}, ${miLng.toFixed(4)}`:'Esperando señal GPS...'}</span>
        </div>
        <button class="action-btn btn-entregar" onclick="marcarEntregado('${p.id}')">
          ✅ Confirmar Entregado
        </button>
      </div>`;
  } else if(p.estado==='entregado'){
    accionHTML=`<div class="action-btn btn-disabled" style="font-size:15px;">✓ Entregado a las ${formatHora(p.entregado_at)}</div>`;
  }

  return `
  <div class="pedido-card">
    <div class="pc-head">
      <div>
        <div class="pc-num">#${p.numero_pedido}</div>
      </div>
      <div class="pc-badge ${eBadge}">${eLabel}</div>
    </div>
    <div class="pc-body">
      <div class="pc-cliente">${p.cliente_nombre}</div>
      <div class="pc-dir" style="font-size:15px;color:var(--text);font-weight:600;background:rgba(249,115,22,.07);border:1px solid rgba(249,115,22,.2);border-radius:10px;padding:12px 14px;margin-bottom:12px;"><span class="pc-dir-ico">📍</span>${p.direccion}</div>
      ${descHTML}
      ${tiempoHTML}
      ${telHTML}
      ${accionHTML}
    </div>
  </div>`;
}

// ── ACCIONES ──────────────────────────────────────
async function marcarEnRuta(pedidoId){
  const update={estado:'en_ruta'};
  if(miLat&&miLng){
    update.lat_entrega=miLat;
    update.lng_entrega=miLng;
  }
  const {error}=await sb.from('pedidos').update(update).eq('id',pedidoId);
  if(error){toast('Error al actualizar','err');return;}
  toast('🚀 ¡En ruta! El monitor está siguiendo tu recorrido','info');
  await cargarPedidos();
}

async function marcarEntregado(pedidoId){
  const update={estado:'entregado'};
  if(miLat&&miLng){
    update.lat_entrega=miLat;
    update.lng_entrega=miLng;
  }
  const {error}=await sb.from('pedidos').update(update).eq('id',pedidoId);
  if(error){toast('Error al actualizar','err');return;}
  toast('✅ ¡Entregado! Buen trabajo','ok');
  await cargarPedidos();
}

// ── REALTIME ──────────────────────────────────────
function suscribirRealtime(){
  if(!piloto)return;

  // SIN filtro server-side — Supabase requiere REPLICA IDENTITY FULL para
  // filtros en UPDATE sobre columnas no-PK. Filtramos client-side en su lugar.
  sb.channel('piloto-rt-' + piloto.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'pedidos'}, payload => {
      const row = payload.new || payload.old || {};
      if(row.piloto_id !== piloto.id) return; // filtrar client-side

      // Detectar nueva asignación comparando con estado actual en memoria
      if(payload.eventType==='UPDATE'||payload.eventType==='INSERT'){
        const estadoActual = pedidos.find(p=>p.id===row.id)?.estado;
        if(row.estado==='asignado' && estadoActual!=='asignado'){
          alertaNuevoPedido(row.numero_pedido, row.cliente_nombre);
        }
      }
      cargarPedidos();
    })
    .subscribe(status=>{
      console.log('[Realtime]', status);
    });

  // Polling de respaldo cada 30 seg (cubre desconexiones de websocket)
  if(window._pollingTimer) clearInterval(window._pollingTimer);
  window._pollingTimer = setInterval(cargarPedidos, 30000);
}

// ── UTILS ─────────────────────────────────────────
function formatMins(mins){
  if(mins<60)return `${String(mins).padStart(2,'0')}:00`;
  const h=Math.floor(mins/60),m=mins%60;
  return `${h}h ${String(m).padStart(2,'0')}m`;
}
function formatHora(iso){
  if(!iso)return '—';
  return new Date(iso).toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'});
}

let toastT;
function toast(msg,tipo){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show '+(tipo||'info');
  clearTimeout(toastT);toastT=setTimeout(()=>el.className='',4000);
}

// Mensaje desde service worker al tocar notificación
navigator.serviceWorker?.addEventListener('message', event => {
  if(event.data?.tipo === 'NUEVO_PEDIDO'){
    if(piloto) cargarPedidos();
    if(usuario && !gpsWatchId) activarGPS();
  }
});

// Auto-login sesión activa
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    await iniciarApp(session.user);
  }
  // Sin sesión: se queda en el login del piloto
})();

// Actualizar coordenadas en pantalla cada 10 seg
setInterval(()=>{
  if(!miLat)return;
  document.querySelectorAll('[id^="gps-info-txt-"]').forEach(el=>{
    el.textContent=`Ubicación activa · ${miLat.toFixed(4)}, ${miLng.toFixed(4)}`;
  });
},10000);

// ── WAKE LOCK (mantener pantalla encendida) ────────
let wakeLock = null;
async function activarWakeLock(){
  try {
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('[WakeLock] Pantalla activa');
      wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
    }
  } catch(e){ console.log('[WakeLock] No disponible:', e.message); }
}

// ── PWA INSTALL ──────────────────────────────────
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  console.log('[PWA] Install prompt capturado');
  // Mostrar banner solo si está logueado
  if (usuario) mostrarBannerInstall();
});

window.addEventListener('appinstalled', () => {
  console.log('[PWA] App instalada');
  deferredPrompt = null;
  document.getElementById('install-banner').style.display = 'none';
  toast('App instalada. Las notificaciones llegarán aunque cierres el navegador.', 'ok');
});

function mostrarBannerInstall() {
  // No mostrar si ya la descartó en esta sesión
  if (sessionStorage.getItem('install-dismissed')) return;
  // No mostrar si ya está instalada (standalone)
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  document.getElementById('install-banner').style.display = 'block';
}

async function instalarApp() {
  if (!deferredPrompt) {
    toast('Usa el menú del navegador → "Instalar app" o "Agregar a pantalla de inicio"', 'info');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  console.log('[PWA] Resultado:', outcome);
  deferredPrompt = null;
  document.getElementById('install-banner').style.display = 'none';
}

function cerrarBannerInstall() {
  document.getElementById('install-banner').style.display = 'none';
  sessionStorage.setItem('install-dismissed', '1');
}

// Mostrar banner si el prompt ya llegó antes del login
function checkInstallBanner() {
  if (deferredPrompt && usuario) mostrarBannerInstall();
}

// ── VISIBILITYCHANGE: cuando el piloto vuelve a la app ─
document.addEventListener('visibilitychange', async ()=>{
  if(document.visibilityState==='visible'){
    // Reactivar wake lock
    if(!wakeLock) activarWakeLock();
    // Refrescar pedidos inmediatamente
    if(piloto) cargarPedidos();
    // Reactivar GPS si se perdió
    if(usuario && !gpsWatchId){
      console.log('[GPS] Reactivando tras volver a la app...');
      activarGPS();
    }
    // Reconectar realtime si se desconectó
    if(piloto && !sb.getChannels().find(c=>c.topic.includes('piloto-rt'))){
      suscribirRealtime();
    }
  }
});
</script>
